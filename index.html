<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پشکنینی ژمارەی تەلەگرام</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            text-align: center;
        }
        input {
            width: 80%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 85%;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>پشکنینی ژمارەی تەلەگرام</h2>
    <p>ژمارەی مۆبایل بنووسە بۆ پشکنین:</p>
    
    <input type="text" id="phoneInput" placeholder="+964750XXXXXXX">
    <br>
    <button onclick="checkPhone()">پشکنین بکە</button>

    <div id="result"></div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        function checkPhone() {
            let phone = document.getElementById('phoneInput').value;
            let resultDiv = document.getElementById('result');
            
            if(!phone) {
                resultDiv.innerHTML = "⚠️ تکایە ژمارەیەک بنووسە!";
                resultDiv.style.color = "orange";
                return;
            }

            resultDiv.innerHTML = "⏳ خەریکی پشکنینم...";
            resultDiv.style.color = "blue";

            setTimeout(() => {
                resultDiv.innerHTML = "✅ ئەم ژمارەیە زیندووە لە تەلەگرام!";
                resultDiv.style.color = "green";
            }, 1500);
        }
    </script>

</body>
</html>
